# Template-managed file (see template-sync.json in thepufferlabs/course-content-template).
# Nothing here is course-specific: the product slug is read from meta.json, and the workflow runs
# on whatever the repo's default branch is (main for template-made repos, claude/* for older ones).
name: Sync to Supabase
on:
  push:
    branches: ["**"]
    paths: ["docs/**","blog/**","src/**","assets/**","meta.json","data/**",".content-repo"]
  workflow_dispatch:
jobs:
  gate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      slug: ${{ steps.check.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          slug=$(node -p "require('./meta.json').slug" 2>/dev/null || echo "")
          docs=$(find docs/free docs/premium -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          if [ "$docs" = "0" ] || [ "$slug" = "your-course-slug" ] || [ -z "$slug" ]; then
            echo "Un-filled scaffold / template (slug=$slug, docs=$docs) — skipping sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
  sync:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    uses: thepufferlabs/ci-reusable-actions-workflows/.github/workflows/sync-course-content.yml@main
    with:
      product-slug: ${{ needs.gate.outputs.slug }}
      content-branch: ${{ github.ref_name }}
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
